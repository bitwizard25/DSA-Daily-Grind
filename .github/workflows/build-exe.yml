name: build-exe
on:
  workflow_dispatch:
  push:
    paths: ["google-swe-prep/**", ".github/workflows/build-exe.yml"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: google-swe-prep
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python build.py
      - name: Smoke-test the terminal app
        env:
          GOOGLE_PREP_HOME: ${{ runner.temp }}/prep-home
        run: |
          CLI=dist/google-prep-cli
          if [ -f dist/google-prep-cli.exe ]; then CLI=dist/google-prep-cli.exe; fi
          "$CLI" --version
          "$CLI" roadmap < /dev/null
          "$CLI" today < /dev/null
          "$CLI" problems --topic graphs < /dev/null
      - name: Smoke-test the desktop app (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          GOOGLE_PREP_HOME: ${{ runner.temp }}/prep-home
        run: dist/google-prep --selftest
      - name: Smoke-test the desktop app (Windows, windowed build)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOGLE_PREP_HOME: ${{ runner.temp }}/prep-home
        run: |
          # A windowed exe does not block the shell, so wait for it and check its exit code.
          $p = Start-Process -FilePath dist\google-prep.exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Error "selftest failed: $($p.ExitCode)"; exit 1 }
          Write-Output "desktop selftest ok"
      - uses: actions/upload-artifact@v4
        with:
          name: google-prep-${{ runner.os }}
          path: google-swe-prep/dist/*

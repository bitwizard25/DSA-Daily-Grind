[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-swe-prep"
version = "1.0.0"
description = "Offline interview OS and accountability coach for Google SWE II prep"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "textual>=0.80",
    "sqlmodel>=0.0.48",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
google-prep = "google_prep.cli:main"
google-prep-gui = "google_prep.gui.launcher:main"

[tool.setuptools.packages.find]
include = ["google_prep*"]

[tool.setuptools.package-data]
google_prep = ["gui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["fasttrack: start the plan on Day 1 (Phase 0) instead of Day 3"]

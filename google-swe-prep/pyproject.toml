[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-swe-prep"
version = "0.1.0"
description = "CLI coach for a Google SWE II interview prep plan"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "click>=8", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
google-swe-prep = "google_swe_prep.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
